<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820"><rect x="0" y="0" width="1120" height="820" rx="20" fill="#FAF7F1" stroke="none"/><text fill="#15171C" font-family="'Zen Maru Gothic',system-ui,sans-serif" font-size="28"><tspan x="36" y="58">A small window into your work</tspan></text><rect x="28" y="93" width="526" height="700" rx="18" fill="#F0EFE5" stroke="none"/><rect x="572" y="93" width="520" height="700" rx="18" fill="#F0EFE5" stroke="none"/><text fill="#15171C" font-family="'Zen Maru Gothic',system-ui,sans-serif" font-size="26"><tspan x="52" y="143">Sees</tspan></text><text fill="#15171C" font-family="'Zen Maru Gothic',system-ui,sans-serif" font-size="26"><tspan x="596" y="143">Never sees</tspan></text><text fill="#15171C" font-family="'Zen Maru Gothic',system-ui,sans-serif" font-size="19"><tspan x="52" y="185">Luna's input is deliberately small. For</tspan><tspan x="52" y="214">each line, Sonnet receives:</tspan></text><text fill="#15171C" font-family="'Zen Maru Gothic',system-ui,sans-serif" font-size="19"><tspan x="52" y="266">Your prompt and up to three earlier prompts</tspan><tspan x="52" y="295">from the same session, after code fences,</tspan><tspan x="52" y="324">inline code, indented code, links, file</tspan><tspan x="52" y="353">paths and credential-looking text (sk-…,</tspan><tspan x="52" y="382">Bearer …) are removed.</tspan></text><text fill="#15171C" font-family="'Zen Maru Gothic',system-ui,sans-serif" font-size="19"><tspan x="52" y="434">A turn summary (only after a turn): its</tspan><tspan x="52" y="463">duration, whether you interrupted it, tool</tspan><tspan x="52" y="492">names with counts, the file names (never</tspan><tspan x="52" y="521">folders) of edited files, the program names</tspan><tspan x="52" y="550">of shell commands (pnpm, git; never their</tspan><tspan x="52" y="579">arguments, and VAR=value prefixes are</tspan><tspan x="52" y="608">skipped), how many tool calls failed, how</tspan><tspan x="52" y="637">many subagents ran, and token totals.</tspan></text><text fill="#15171C" font-family="'Zen Maru Gothic',system-ui,sans-serif" font-size="19"><tspan x="52" y="689">Her character and one comedic voice.</tspan></text><text fill="#15171C" font-family="'Zen Maru Gothic',system-ui,sans-serif" font-size="19"><tspan x="596" y="185">She never sees drafts you have not sent,</tspan><tspan x="596" y="214">file contents, command arguments or</tspan><tspan x="596" y="243">output, tool results, or Claude's replies.</tspan><tspan x="596" y="272">Only prompts you typed count; messages</tspan><tspan x="596" y="301">from other agents or automations do not.</tspan><tspan x="596" y="330">Nothing is stored except her settings (on</tspan><tspan x="596" y="359">or off, when, stay, stats) in the plugin's</tspan><tspan x="596" y="388">own store.</tspan></text><rect x="892" y="713" width="170" height="54" rx="10" fill="#FAF7F1" stroke="none"/><image x="917" y="720" width="120" height="40" href="data:image/png;base64,"/></svg>